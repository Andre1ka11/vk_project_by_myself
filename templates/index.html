{% extends "base.html" %}
{% load static %}

{% block content %}

    <!-- Список вопросов текущей страницы -->
    {% for question in page %}
        <div class="card mb-4 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-3">
                    <img src="{% static 'photo.png' %}" width="48" height="48" class="rounded-circle object-fit-cover me-2">
                    <h5 class="mb-0">{{ question.title }}</h5>
                </div>
                <p class="text-muted mb-3">
                    {{ question.text }}
                </p>
                <a href="{% url 'question' question_id=question.id %}" class="btn rounded-pill fw-semibold" style="background-color:#FFD180; color:#7A4A00;">
                    Читать вопрос
                </a>
            </div>
        </div>
    {% endfor %}

    <!-- Пагинатор -->
    <nav aria-label="Навигация по страницам">
        <ul class="pagination justify-content-center">

            <li class="page-item {% if not page.has_previous %}disabled{% endif %}">
                <a class="page-link" href="{% if page.has_previous %}{% url 'index' %}?page={{ page.previous_page_number }}{% else %}#{% endif %}">Назад</a>
            </li>

            {% for num in page.paginator.page_range %}
                <li class="page-item {% if num == page.number %}active{% endif %}">
                    <a class="page-link" href="{% url 'index' %}?page={{ num }}">{{ num }}</a>
                </li>
            {% endfor %}

            <li class="page-item {% if not page.has_next %}disabled{% endif %}">
                <a class="page-link" href="{% if page.has_next %}{% url 'index' %}?page={{ page.next_page_number }}{% else %}#{% endif %}">Вперёд</a>
            </li>

        </ul>
    </nav>

{% endblock %}
