{% extends "base.html" %}
{% load static %}

{% block content %}

    <div class="d-flex justify-content-center">
        <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">
                <h4 class="mb-4 text-center">Вход</h4>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-control" maxlength="150" placeholder="Введите логин">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control is-invalid" maxlength="128" placeholder="Введите пароль">
                        <div class="invalid-feedback">
                            Неверный логин или пароль.
                        </div>
                    </div>

                    <button type="submit" class="btn w-100 rounded-pill fw-semibold" style="background-color:#FFD180; color:#7A4A00;">
                        Войти
                    </button>
                </form>

                <p class="text-center text-muted small mt-3 mb-0">
                    Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>

{% endblock %}
